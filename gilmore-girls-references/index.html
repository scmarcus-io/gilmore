<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwiftMap</title><link rel="stylesheet" href="/static.css"></head><body><header><div><p class="eyebrow">A lyrical constellation</p><h1>SwiftMap <span></span></h1><p class="sub">Explore the connections across Taylor Swift’s albums.</p></div><button id="addBtn" class="primary">＋ Add a connection</button></header><main><section class="toolbar"><input id="search" placeholder="Search songs or albums…"><select id="album"><option value="">All albums</option></select><div class="modes"><button data-mode="human">Human</button><button data-mode="compare" class="active">Compare</button><button data-mode="ai">AI</button></div></section><section class="legend"><span><i class="dot human"></i>Human connections</span><span><i class="dot ai"></i>AI connections</span><span id="count"></span></section><section id="canvas" aria-label="Song connection map"></section></main><dialog id="songDialog"><button class="close">×</button><div id="songDetail"></div></dialog><dialog id="connectionDialog"><button class="close">×</button><h2>Connect two songs</h2><p class="muted">Make a thoughtful connection. Notes must be at least 20 characters.</p><form id="connectionForm"><label>From<select name="source_id" required></select></label><label>To<select name="target_id" required></select></label><label>Your name <span>(optional)</span><input name="author" placeholder="Anonymous"></label><label>Why are they connected?<textarea name="note" minlength="20" maxlength="500" required placeholder="These songs share…"></textarea></label><button class="primary" type="submit">Publish connection</button><p id="formError" class="error"></p></form></dialog><script src="/static.js"></script></body></html>
