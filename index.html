<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Software engineer portfolio: a cozy small-town tour." />
    <title>Welcome to Town | Software Engineer Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 10h16v10a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z' fill='%23f3e9d2' stroke='%233b2a1f' stroke-width='2'/><path d='M22 13h2a3 3 0 0 1 0 6h-2' fill='none' stroke='%233b2a1f' stroke-width='2'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Special+Elite&family=Caveat:wght@500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body class="mode-town">
    <a class="skip-link" href="#app">Skip to main content</a>
    <header class="site-header">
      <p class="brand"><span class="brand__cup" aria-hidden="true"></span><span id="brand-name">Your Name</span></p>
      <nav class="site-header__actions" aria-label="Site">
        <a id="mode-toggle" class="btn btn--ghost" href="#list">Skip the tour</a>
        <button id="contact-me" class="btn" type="button">Contact me</button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <p class="map-hint" aria-hidden="true">Drag, scroll, or use arrow keys to wander. Click a building to step inside.</p>

    <dialog id="location-dialog" class="location-dialog">
      <form method="dialog" class="location-dialog__bar">
        <button class="btn btn--ghost" aria-label="Back to town">&larr; Back to town</button>
      </form>
      <div class="location-dialog__content"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
